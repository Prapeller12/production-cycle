name: Production cycle shared folder launch
on:
  push:
    branches: [feat/shared-folder-browser]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Fetch the verified self-contained server release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/base -Force | Out-Null
          Invoke-WebRequest 'https://github.com/Prapeller12/production-cycle/releases/download/browser-server-b7dbce3/ProductionCycle-server-b7dbce3-windows-x64.zip' -OutFile dist/base/server.zip
          if((Get-FileHash dist/base/server.zip -Algorithm SHA256).Hash.ToLowerInvariant() -cne 'c100a0c8b772415ff1d76287fdd9567ac2e152e3763518c63f1cdc04d083f466'){throw 'Verified server release digest mismatch'}
      - name: Build shared-folder package and offline instructions
        shell: pwsh
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/domain.test.cjs
          if($LASTEXITCODE -ne 0){throw 'Domain contract regression'}
          python -m pip install python-docx==1.2.0
          python scripts/create-server-guide.py --version $env:GITHUB_SHA.Substring(0,7) --source docs/server-shared-guide.json --basename ProductionCycle_SharedFolder_Guide --out dist/shared-manual
          if($LASTEXITCODE -ne 0){throw 'Shared-folder instruction build failed'}
          ./scripts/package-shared-folder-windows.ps1 -Version $env:GITHUB_SHA.Substring(0,7) -BaseZip dist/base/server.zip
      - name: Real read-only SMB launch through Windows PowerShell 5.1
        timeout-minutes: 6
        shell: pwsh
        run: |
          $zip=Get-ChildItem ./dist/shared-folder/*.zip | Select-Object -First 1
          ./scripts/test-shared-folder.ps1 -Zip $zip.FullName
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: shared-folder-evidence-${{ matrix.os }}
          path: dist/shared-qa/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ProductionCycleSharedFolder-${{ matrix.os }}
          path: dist/shared-folder/*.zip*
          if-no-files-found: error
  release:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@v4
        with:
          name: ProductionCycleSharedFolder-windows-2022
          path: release
      - name: Publish separate shared folder variant
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="shared-folder-${GITHUB_SHA:0:7}"
          gh release create "$tag" release/*.zip release/*.sha256 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Производственный цикл — открытие из общей папки" --notes-file docs/server-shared-folder.md
