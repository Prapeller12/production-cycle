name: Production cycle button and native print audit
on:
  push:
    branches: [fix/button-audit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Fetch the verified unchanged server
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path dist/base -Force | Out-Null
          gh release download shared-folder-4c84ac6 --repo $env:GITHUB_REPOSITORY --pattern '*.zip' --output dist/base/server.zip
          if($LASTEXITCODE -ne 0){throw 'Base release download failed'}
          if((Get-FileHash dist/base/server.zip -Algorithm SHA256).Hash.ToLowerInvariant() -cne '1c05e7b1c886de20efaa3acc35e9135de0fb904ed584a1e863b5a9f54892e10a'){throw 'Verified server release digest mismatch'}
          Expand-Archive dist/base/server.zip dist/base/unpacked
          $base=Join-Path $env:GITHUB_WORKSPACE 'dist/base/unpacked/ProductionCycleServer'
          "SERVER_EXE=$base/Производственный_цикл.exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "BASELINE_FRONTEND=$base/frontend" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build offline assets and check domain rules
        shell: pwsh
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if($LASTEXITCODE -ne 0){throw 'Dependency preparation failed'}
          npm run build:legacy
          if($LASTEXITCODE -ne 0){throw 'Legacy asset build failed'}
          node --test tests/domain.test.cjs
          if($LASTEXITCODE -ne 0){throw 'Domain regression'}
          git diff --check
          if($LASTEXITCODE -ne 0){throw 'Whitespace regression'}
      - name: Real MSHTML layout, button and native print regression
        shell: pwsh
        env:
          SERVER_QA_DIR: ${{ github.workspace }}/dist/ie-layout-qa
        run: |
          $env:IE_HARNESS=Join-Path $env:RUNNER_TEMP 'production-cycle-ie-layout.exe'
          $source=Join-Path $env:GITHUB_WORKSPACE 'tests/server/ie-harness.cs'
          & powershell.exe -NoProfile -Command "Add-Type -Path '$source' -ReferencedAssemblies System.Windows.Forms,System.Drawing -OutputAssembly '$env:IE_HARNESS' -OutputType WindowsApplication"
          if($LASTEXITCODE -ne 0){throw 'MSHTML harness build failed'}
          node tests/server/ie-layout.cjs
          if($LASTEXITCODE -ne 0){throw 'Real IE layout regression'}
          node tests/server/ie.cjs
          if($LASTEXITCODE -ne 0){throw 'Real IE functional regression'}
          node tests/server/ie-print.cjs
          if($LASTEXITCODE -ne 0){throw 'Real IE native print regression'}
      - name: Edge, offline resource check and report print regression
        shell: pwsh
        env:
          SERVER_QA_DIR: ${{ github.workspace }}/dist/browser-qa
        run: |
          $edge=@('C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe','C:/Program Files/Microsoft/Edge/Application/msedge.exe') | Where-Object {Test-Path $_} | Select-Object -First 1
          if(-not $edge){throw 'Microsoft Edge is unavailable'}
          $env:PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$edge
          node tests/server/browser.cjs
          if($LASTEXITCODE -ne 0){throw 'Browser regression'}
          python -m pip install PyMuPDF==1.26.7
          if($LASTEXITCODE -ne 0){throw 'PDF verifier preparation failed'}
          python tests/server/verify-pdf.py dist/browser-qa
          if($LASTEXITCODE -ne 0){throw 'Printed report regression'}
      - name: Package frontend only
        shell: pwsh
        run: |
          python scripts/package-frontend-update.py --version $env:GITHUB_SHA.Substring(0,7)
          if($LASTEXITCODE -ne 0){throw 'Frontend packaging failed'}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: button-evidence-${{ matrix.os }}
          path: |
            dist/ie-layout-qa/
            dist/browser-qa/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ProductionCycleButtons-${{ matrix.os }}
          path: dist/frontend-update/*.zip*
          if-no-files-found: error
  release:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@v4
        with:
          name: ProductionCycleButtons-windows-2022
          path: release
      - name: Publish verified frontend update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="button-audit-${GITHUB_SHA:0:7}"
          gh release create "$tag" release/*.zip release/*.sha256 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Производственный цикл — кнопки и печать IE" --notes-file docs/ie-layout-update.txt
