name: Recheck exact released Excel server interactions
on:
  push:
    branches: [test/post-excel-availability]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare test drivers
        shell: pwsh
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if($LASTEXITCODE -ne 0){throw 'Dependency preparation failed'}
          python tests/server/make-excel-fixtures.py
          if($LASTEXITCODE -ne 0){throw 'Workbook fixtures failed'}
          npm run build:legacy
          if($LASTEXITCODE -ne 0){throw 'IE test driver build failed'}
          node --test tests/domain.test.cjs
          if($LASTEXITCODE -ne 0){throw 'Domain regression'}
          git diff --check
          if($LASTEXITCODE -ne 0){throw 'Whitespace errors'}
      - name: Use exact previously delivered package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path dist/released -Force | Out-Null
          gh release download server-excel-14fbf50 --repo $env:GITHUB_REPOSITORY --pattern '*.zip' --output dist/released/server.zip
          if($LASTEXITCODE -ne 0){throw 'Release download failed'}
          if((Get-FileHash dist/released/server.zip -Algorithm SHA256).Hash.ToLowerInvariant() -cne '99ecf6e76a71bd6858d584c86a6101b2a08410bc77cf2f2989c04e2aed037c3b'){throw 'Released ZIP hash mismatch'}
          Expand-Archive dist/released/server.zip dist/released/unpacked
          $root=Join-Path $env:GITHUB_WORKSPACE 'dist/released/unpacked/ProductionCycleServer'
          $manifest=Get-Content "$root/package-manifest.json" -Raw | ConvertFrom-Json
          foreach($entry in $manifest.files){if((Get-FileHash -LiteralPath (Join-Path $root $entry.path) -Algorithm SHA256).Hash.ToLowerInvariant() -cne $entry.sha256){throw "Manifest mismatch $($entry.path)"}}
          Remove-Item frontend -Recurse -Force
          Copy-Item "$root/frontend" frontend -Recurse
          "SERVER_EXE=$root/Производственный_цикл.exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $edge=@('C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe','C:/Program Files/Microsoft/Edge/Application/msedge.exe') | Where-Object {Test-Path $_} | Select-Object -First 1
          if(-not $edge){throw 'Microsoft Edge unavailable'}
          "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$edge" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Edge full button suite, real pointer and Enter, search and template round trip
        shell: pwsh
        env:
          SERVER_QA_DIR: ${{ github.workspace }}/dist/recheck-edge
        run: |
          node tests/server/buttons.cjs
          if($LASTEXITCODE -ne 0){throw 'Edge all-button regression'}
          node tests/server/excel-ui.cjs
          if($LASTEXITCODE -ne 0){throw 'Edge Excel role regression'}
          node tests/server/search-template.cjs
          if($LASTEXITCODE -ne 0){throw 'Edge pointer/search/template regression'}
      - name: Native IE full button suite, search availability and exact template bytes
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          SERVER_QA_DIR: ${{ github.workspace }}/dist/recheck-ie
        run: |
          $env:IE_HARNESS=Join-Path $env:RUNNER_TEMP 'production-cycle-ie.exe'
          $source=Join-Path $env:GITHUB_WORKSPACE 'tests/server/ie-harness.cs'
          & powershell.exe -NoProfile -Command "Add-Type -Path '$source' -ReferencedAssemblies System.Windows.Forms,System.Drawing -OutputAssembly '$env:IE_HARNESS' -OutputType WindowsApplication"
          if($LASTEXITCODE -ne 0){throw 'MSHTML harness build failed'}
          node tests/server/ie-buttons.cjs
          if($LASTEXITCODE -ne 0){throw 'IE all-button regression'}
          node tests/server/excel-ui.cjs --ie
          if($LASTEXITCODE -ne 0){throw 'IE Excel role regression'}
          node tests/server/search-template.cjs --ie
          if($LASTEXITCODE -ne 0){throw 'IE focused search/template regression'}
      - name: Backend authorization and workbook validation
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          SERVER_QA_DIR: ${{ github.workspace }}/dist/recheck-api
        run: |
          node tests/server/excel-api.cjs
          if($LASTEXITCODE -ne 0){throw 'Excel API regression'}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Excel-recheck-${{ matrix.os }}
          path: |
            dist/recheck-edge/
            dist/recheck-ie/*.json
            dist/recheck-ie/*.png
            dist/recheck-api/
          if-no-files-found: error
