name: Production cycle network test
on:
  push:
    branches: [feat/network-share-multiuser]
  pull_request:
    branches: [codex/production-cycle-prototype]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test tests/domain.test.cjs
      - name: Install browser test tools
        run: |
          npm install --prefix /tmp/prototype-tests playwright@1.58.2
          /tmp/prototype-tests/node_modules/.bin/playwright install --with-deps chromium
      - name: Run browser scenarios
        env:
          PLAYWRIGHT_MODULE: /tmp/prototype-tests/node_modules/playwright
        run: node tests/browser.cjs
  windows-network-host:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-rust-network-${{ matrix.os }}-${{ hashFiles('src-tauri/Cargo.toml') }}-${{ github.run_id }}
          restore-keys: windows-rust-network-${{ matrix.os }}-${{ hashFiles('src-tauri/Cargo.toml') }}-
      - name: Test Rust host, migrations and network coordination
        run: cargo test --locked --release --features custom-protocol --manifest-path src-tauri/Cargo.toml
      - name: Build network host
        run: cargo build --locked --release --features custom-protocol --manifest-path src-tauri/Cargo.toml
      - name: Obtain and verify Microsoft Fixed Runtime
        shell: pwsh
        run: ./scripts/fetch-runtime.ps1 -Destination "$env:RUNNER_TEMP/fixed-webview"
      - name: Package separate network ZIP
        shell: pwsh
        run: |
          $runtime=(Get-Content "$env:RUNNER_TEMP/fixed-webview/runtime-path.txt" -Raw).Trim()
          $version='network-test-'+$env:GITHUB_SHA.Substring(0,7)
          ./scripts/package-network-windows.ps1 -FixedRuntimePath $runtime -Version $version -OutputPath ./dist/network
      - name: Test real SMB UNC/IP launch and every native workflow
        shell: pwsh
        run: |
          $version='network-test-'+$env:GITHUB_SHA.Substring(0,7)
          ./scripts/test-network-portable.ps1 -Zip ./dist/network/ProductionCycle-network-test-windows10-11-x64.zip -Version $version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: production-cycle-network-evidence-${{ matrix.os }}
          path: |
            src-tauri/Cargo.lock
            ${{ runner.temp }}/Сетевая проверка программы/network-*.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ProductionCycle-network-test-windows10-11-x64-${{ matrix.os }}
          path: |
            dist/network/*.zip
            dist/network/*.sha256
          if-no-files-found: error
      - name: Publish network prerelease
        if: github.event_name == 'push' && matrix.os == 'windows-2022'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='network-test-'+$env:GITHUB_SHA.Substring(0,7)
          gh release create $tag ./dist/network/ProductionCycle-network-test-windows10-11-x64.zip ./dist/network/ProductionCycle-network-test-windows10-11-x64.zip.sha256 --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title "Production Cycle — network test" --notes-file docs/network-test-release-notes.md
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-rust-network-${{ matrix.os }}-${{ hashFiles('src-tauri/Cargo.toml') }}-${{ github.run_id }}
