name: Production cycle native checks
on:
  push:
    branches: [main, codex/production-cycle-prototype]
    paths: ['frontend/**', 'src-tauri/**', 'server/**', 'scripts/**', 'config/**', '.cargo/**', 'tests/**', 'package*.json', '.github/workflows/production-cycle-prototype.yml', '.github/workflows/production-cycle-startup.yml']
  pull_request:
    branches: [main]
    paths: ['frontend/**', 'src-tauri/**', 'server/**', 'scripts/**', 'config/**', '.cargo/**', 'tests/**', 'package*.json', '.github/workflows/production-cycle-prototype.yml', '.github/workflows/production-cycle-startup.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test tests/domain.test.cjs
      - run: git diff --check
  # Exercise the packaged EXE and its actual IPC, Excel, print and SMB paths.
  # tests/browser.cjs belongs to the historical prototype with paired TXT import.
  native:
    needs: contracts
    uses: ./.github/workflows/production-cycle-startup.yml
    permissions:
      contents: read
