name: Production cycle native checks
on:
  push:
    branches: [main, codex/production-cycle-prototype]
    paths: ['frontend/**', 'src-tauri/**', 'server/**', 'scripts/**', 'config/**', '.cargo/**', 'tests/**', 'package*.json', '.github/workflows/production-cycle-prototype.yml', '.github/workflows/production-cycle-startup.yml']
  pull_request:
    branches: [main]
    paths: ['frontend/**', 'src-tauri/**', 'server/**', 'scripts/**', 'config/**', '.cargo/**', 'tests/**', 'package*.json', '.github/workflows/production-cycle-prototype.yml', '.github/workflows/production-cycle-startup.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    # Keep the pinned Playwright 1.58.2 on its supported Ubuntu generation.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test tests/domain.test.cjs
      - run: git diff --check
      - name: Install browser test tools
        run: |
          npm install --prefix /tmp/prototype-tests playwright@1.58.2
          /tmp/prototype-tests/node_modules/.bin/playwright install --with-deps chromium
      - name: Run browser scenarios
        env:
          PLAYWRIGHT_MODULE: /tmp/prototype-tests/node_modules/playwright
        run: node tests/browser.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: production-cycle-visual-check
          path: |
            /tmp/production-cycle-*.png
            /tmp/production-cycle-report.pdf
            /tmp/production-cycle-structure-print.pdf
            /tmp/production-cycle-gantt-print-a3.pdf
            /tmp/production-cycle-gantt-print-a4.pdf
  native:
    needs: contracts
    uses: ./.github/workflows/production-cycle-startup.yml
    permissions:
      contents: read
